name: Build APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 9.x 需要 JDK 17+，这里用 21 留余量
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          # 不依赖 android-actions/setup-android，直接用 runner 自带的 cmdline-tools
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" | tail -5

      - name: Build release
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build_output.log

      - name: Show errors on failure
        if: failure()
        run: |
          echo "## 构建失败"
          echo '```'
          grep -E "^e: |error:|FAILURE|What went wrong|Caused by" -A 4 build_output.log | head -120
          echo '```'

      - name: Locate APK
        id: find
        run: |
          # build.gradle 把 buildDirectory 指到了 java.io.tmpdir
          APK=$(find /tmp/douyin-immersive-gradle -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find . -name "*.apk" -not -path "./.git/*" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "found: $APK"
          [ -n "$APK" ] && ls -lh "$APK"

      - name: Upload artifact
        if: steps.find.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyim-apk
          path: ${{ steps.find.outputs.apk }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.find.outputs.apk != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.apk }}
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
