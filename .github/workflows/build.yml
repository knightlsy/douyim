name: Build APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 9.x 需要 JDK 17+，这里用 21 留余量
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Probe Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"
          echo "SDKM=$SDKM" >> $GITHUB_ENV
          echo "--- 已装 platforms ---"
          ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null || echo "(无)"
          echo "--- 已装 build-tools ---"
          ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" 2>/dev/null || echo "(无)"
          echo "--- 仓库里有没有 android-37 ---"
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[5-9]" | head -10 || echo "(查询失败)"

      - name: Install SDK components
        run: |
          set -o pipefail
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # compileSdk 37 装不上时退回 36（先试 37）
          "$SDKM" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -6 || \
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -6

      - name: Build release
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build_output.log

      - name: Show errors on failure
        if: failure()
        run: |
          echo "## 构建失败"
          echo '```'
          grep -E "^e: |error:|FAILURE|What went wrong|Caused by|Could not" -A 4 build_output.log | head -120
          echo '```'

      - name: Locate APK
        id: find
        run: |
          APK=$(find /tmp/douyin-immersive-gradle -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find . -name "*.apk" -not -path "./.git/*" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "found: $APK"
          [ -n "$APK" ] && ls -lh "$APK"

      - name: Upload artifact
        if: steps.find.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyim-apk
          path: ${{ steps.find.outputs.apk }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.find.outputs.apk != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.apk }}
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
